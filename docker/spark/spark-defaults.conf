# Spark defaults for every Strata container.
#
# Job-level settings (shuffle partitions, executor memory) are NOT here — they
# come from configs/*.yaml so that smoke and full scale differ in one place.
# What lives here is infrastructure: where the cluster is, where event logs go,
# and the handful of settings that must be identical across driver, master,
# worker and history server or the history server cannot read what the driver
# wrote.

spark.master                       spark://spark-master:7077

# Event logging is not optional here. src/strata/metrics parses these files to
# recover per-stage shuffle and spill figures, because the live REST API only
# exposes a running application and every experiment run is over by the time we
# want to read it.
spark.eventLog.enabled             true
spark.eventLog.dir                 hdfs://namenode:8020/spark-events
spark.eventLog.compress            false

spark.history.fs.logDirectory      hdfs://namenode:8020/spark-events
spark.history.ui.port              18080
# Rescan quickly; the default 10s means a just-finished experiment is not in the
# UI when you look for it.
spark.history.fs.update.interval   5s

spark.hadoop.fs.defaultFS          hdfs://namenode:8020
spark.hadoop.dfs.replication       1

# Adaptive Query Execution defaults ON, matching what any recent Spark
# deployment does. Experiment 5 turns it off explicitly to measure what it is
# worth; leaving it off globally would flatter the skew-handling results by
# removing the baseline's best defence.
spark.sql.adaptive.enabled                        true
spark.sql.adaptive.coalescePartitions.enabled     true
spark.sql.adaptive.skewJoin.enabled               true

# Parquet/ORC filter pushdown on by default — experiment 5 measures the delta by
# disabling it, so the default has to be the realistic one.
spark.sql.parquet.filterPushdown   true
spark.sql.orc.filterPushdown       true

# Write the Spark 3.x timestamp/date rebase modes explicitly. Without them,
# writing dates outside the Gregorian cutover throws at write time with a long
# message about calendar rebasing. The generator produces a deliberate
# out-of-range date defect, and it must land in quarantine rather than crash the
# writer before quality ever sees it.
spark.sql.parquet.datetimeRebaseModeInWrite       CORRECTED
spark.sql.parquet.int96RebaseModeInWrite          CORRECTED
spark.sql.avro.datetimeRebaseModeInWrite          CORRECTED

# Off. The default writes a _SUCCESS marker and, on some filesystems, summary
# metadata files; the marker is harmless but the file counts in experiment 3
# should reflect data files only.
spark.sql.sources.commitProtocolClass             org.apache.spark.sql.execution.datasources.SQLHadoopMapReduceCommitProtocol
spark.hadoop.mapreduce.fileoutputcommitter.marksuccessfuljobs  false

spark.ui.showConsoleProgress       false
spark.driver.host                  spark-client
